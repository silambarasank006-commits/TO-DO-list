<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>
    <link rel="icon" href="image/to-do-list.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="start">
            <div class="mid">
                <h1>Todo app</h1>
                <p>Keep it up</p>
                <div id="bar">
                <div id="progress"></div>
             </div>
            </div>

                <div class="end">
                    <p id="numbers">0/0</p>
                </div>
            </div>
       <form class="action">
        <input type="text" id="taskInput" placeholder="write your task">
        <button id="newtask" type="submit">+</button>
        </form>
        <ul id="tasklist"></ul>
    <script src="./script.js"></script>

            <script
            src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js"></script>
</body>
</html>
